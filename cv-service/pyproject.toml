[project]
name = "dizpitch-cv-service"
version = "0.1.0"
description = "Local computer-vision service for DizPitch: football player/ball detection, tracking and pitch calibration"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "numpy>=1.26",
  "opencv-python>=4.10",
  "torch>=2.4",
  "ultralytics>=8.3",
  "supervision>=0.25,<0.31",
  "trackers>=2.6",
  "gdown>=5.2",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs model weights and a real clip (skipped otherwise)"]

[tool.uv]
package = false
